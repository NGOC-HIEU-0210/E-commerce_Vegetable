<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IND MART – Frontend Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f3f7f4;color:#1f2937;font-size:14px;line-height:1.55}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:#1f2937}
h1,h2,h3,h4{margin:0}
#app{flex:1;display:flex;flex-direction:column;min-height:100vh}
.container{width:min(1200px,94%);margin:0 auto}
.page{padding:22px 0 46px;flex:1}
.muted{color:#6b7280}
.small{font-size:12px}
.bold{font-weight:700}
.right{text-align:right}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.grow{flex:1}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid transparent;transition:.15s;background:#eef3f0;color:#1f2937}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#1e7a4f;color:#fff}
.btn-outline{border-color:#cfe0d6;background:#fff;color:#1e7a4f}
.btn-danger{background:#fde8ec;color:#e11d48}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:12px 22px;font-size:15px;border-radius:12px}
.btn-block{width:100%}
.linklike{background:none;border:0;padding:0;color:#1e7a4f;font-weight:600;cursor:pointer}

/* topstrip + header */
.topstrip{background:#0f3d27;color:#cdeede;font-size:12px;text-align:center;padding:6px 10px}
.topstrip b{color:#8fe3bd}
.site-header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid #e4eae6;box-shadow:0 1px 6px rgba(20,40,30,.06)}
.header-top{display:flex;align-items:center;gap:16px;padding:12px 0}
.logo{font-size:22px;font-weight:800;color:#1e7a4f;display:flex;align-items:center;gap:8px;cursor:pointer;letter-spacing:.3px}
.logo-badge{background:#1e7a4f;color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.search-box{flex:1;display:flex;max-width:540px;background:#f2f6f3;border:1px solid #e0e8e2;border-radius:999px;padding:4px 6px 4px 14px;gap:8px}
.search-box input{flex:1;border:0;background:transparent;outline:0;font-size:14px;min-width:0}
.header-actions{display:flex;gap:6px;margin-left:auto;align-items:center}
.icon-btn{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:#f2f6f3}
.icon-btn:hover{background:#e8efeb}
.icon-btn .cnt{position:absolute;top:-4px;right:-4px;background:#e11d48;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.header-nav{border-top:1px solid #eef3f0}
.header-nav .container{display:flex;gap:2px;overflow-x:auto;padding:0}
.nav-link{padding:11px 14px;font-weight:600;color:#4b5563;font-size:13.5px;border-radius:8px;white-space:nowrap}
.nav-link:hover{background:#f2f6f3}
.nav-link.active{color:#1e7a4f;background:#e6f4ec}
.admin-entry{margin-left:auto;color:#e11d48;font-weight:700;font-size:13px}

/* hero */
.hero{display:flex;gap:24px;align-items:center;background:linear-gradient(120deg,#0f3d27,#1e7a4f 60%,#2f9e6e);border-radius:20px;padding:38px 36px;color:#fff;overflow:hidden;position:relative}
.hero-left{flex:1.25;position:relative;z-index:1}
.hero-tag{display:inline-block;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-size:12.5px;margin-bottom:12px}
.hero h1{font-size:34px;line-height:1.2;margin-bottom:12px}
.hero h1 em{color:#ffd166;font-style:normal}
.hero p{opacity:.92;max-width:46ch;margin-bottom:18px}
.hero-stats{display:flex;gap:26px;margin-top:20px}
.hero-stats b{font-size:19px;display:block}
.hero-stats span{font-size:12px;opacity:.8}
.hero-right{flex:1;display:flex;justify-content:center;font-size:110px;position:relative;min-height:150px}
.hero-right .float{position:absolute;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* sections */
.section{margin-top:30px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-head h2{font-size:20px}
.section-link{color:#1e7a4f;font-weight:700;font-size:13px;cursor:pointer}

/* category cards */
.grid-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat-card{background:#fff;border:1px solid #e7eeea;border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;transition:.15s}
.cat-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,40,30,.08);border-color:#cde6d6}
.cat-card .ce{font-size:38px}
.cat-card b{display:block;margin-top:8px;font-size:13.5px}

/* product grid + card */
.grid-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.product-card{background:#fff;border:1px solid #e7eeea;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:.15s}
.product-card:hover{box-shadow:0 10px 22px rgba(20,40,30,.10)}
.pimg{height:150px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#e9f5ee,#d7e9de)}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font-weight:700;font-size:14px;line-height:1.35;min-height:38px}
.pmeta{display:flex;justify-content:space-between;align-items:center}
.cat-chip{background:#e6f4ec;color:#1e7a4f;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.price{font-weight:800;color:#e8590c;font-size:16px}
.price-old{color:#9ca3af;text-decoration:line-through;font-size:12px;margin-left:6px;font-weight:400}
.discount-badge{background:#e11d48;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;display:inline-block}
.stock{font-size:12px;color:#1e7a4f;font-weight:600}
.stock.low{color:#e8590c}
.pactions{display:flex;gap:8px;margin-top:8px}
.pactions .btn{flex:1;padding:7px 6px;font-size:12.5px}
.fav-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:2}
.fav-btn.active{background:#ffe3ea}

/* panel */
.panel{background:#fff;border:1px solid #e7eeea;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(20,40,30,.05)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.panel-title{font-size:16px;font-weight:800}

/* table */
.table-wrap{overflow-x:auto}
table.table{width:100%;border-collapse:collapse;min-width:640px}
.table th{background:#f6faf7;color:#374151;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid #e7eeea;white-space:nowrap}
.table td{padding:11px 12px;border-bottom:1px solid #f0f4f1;vertical-align:middle;font-size:13.5px}
.table tr:hover td{background:#fafdfb}

/* status badges */
.st{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-PENDING{background:#fef3c7;color:#92400e}
.st-CONFIRMED{background:#dbeafe;color:#1e40af}
.st-SHIPPING{background:#ede9fe;color:#5b21b6}
.st-COMPLETED{background:#d1fae5;color:#065f46}
.st-CANCELLED{background:#fee2e2;color:#991b1b}
.st-PAID{background:#d1fae5;color:#065f46}
.st-UNPAID{background:#fef3c7;color:#92400e}
.st-ACTIVE{background:#d1fae5;color:#065f46}
.st-SOLD_OUT{background:#e5e7eb;color:#4b5563}
.st-EXPIRED{background:#fee2e2;color:#991b1b}

/* forms */
.field{margin-bottom:12px}
.label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:#374151}
.input,.select,.textarea{width:100%;padding:9px 12px;border:1px solid #dde6e0;border-radius:10px;background:#fff;outline:0;font-size:14px}
.input:focus,.select:focus,.textarea:focus{border-color:#2f9e6e;box-shadow:0 0 0 3px rgba(46,158,110,.15)}
.textarea{min-height:70px;resize:vertical}
.form-error{background:#fde8ec;color:#e11d48;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;font-weight:600}

/* qty */
.qty{display:inline-flex;align-items:center;border:1px solid #dde6e0;border-radius:10px;overflow:hidden;background:#fff}
.qty button{width:30px;height:30px;background:#f2f6f3;font-size:16px;font-weight:700}
.qty button:hover{background:#e8efeb}
.qty span{min-width:38px;text-align:center;font-weight:700}

/* cart */
.cart-row{display:grid;grid-template-columns:64px 1fr auto auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #eef3f0}
.cart-row:last-child{border-bottom:0}
.cart-emoji{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#e9f5ee,#d7e9de);display:grid;place-items:center;font-size:32px}

/* summary */
.summary{padding:18px;position:sticky;top:140px}
.summary .rowline{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.summary .rowline.total{border-top:1px dashed #dfe8e2;margin-top:8px;padding-top:10px;font-weight:800;font-size:16px}

/* orders */
.order-card{background:#fff;border:1px solid #e7eeea;border-radius:14px;padding:16px 18px}
.order-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid #f0f4f1;margin-bottom:10px}
.order-item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.order-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;border-top:1px solid #f0f4f1;padding-top:10px}
.timeline{padding:6px 0}
.tl-item{position:relative;padding:0 0 18px 24px;border-left:2px solid #e5e7eb;margin-left:7px}
.tl-item:last-child{border-left-color:transparent;padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:#d1d5db}
.tl-item.done::before{background:#1e7a4f;box-shadow:0 0 0 3px #d1fae5}
.tl-item.current::before{background:#1e7a4f;box-shadow:0 0 0 4px #a7f3d0}
.tl-item .t{font-weight:700;font-size:13px}
.tl-item .d{font-size:12px;color:#6b7280}

/* auth */
.auth-wrap{max-width:430px;margin:40px auto}
.auth-card{padding:24px}

/* admin layout */
.admin-layout{display:flex;min-height:100vh;background:#f3f7f4}
.sidebar{width:236px;background:#0f3d27;color:#cdeede;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.sidebar .logo{color:#fff;margin-bottom:18px}
.side-menu{flex:1;overflow-y:auto;padding-bottom:10px}
.side-group{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#7fb8a0;padding:14px 22px 6px}
.side-link{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;color:#cdeede;font-weight:600;font-size:13.5px;margin:2px 10px;cursor:pointer}
.side-link:hover{background:rgba(255,255,255,.08)}
.side-link.active{background:rgba(255,255,255,.14);color:#fff}
.sidebar-foot{padding:14px 18px;font-size:11.5px;color:#7fb8a0;border-top:1px solid rgba(255,255,255,.08)}
.admin-main{flex:1;display:flex;flex-direction:column;min-width:0}
.admin-topbar{background:#fff;border-bottom:1px solid #e4eae6;padding:13px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.admin-content{padding:22px 24px 46px}

/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat-card{background:#fff;border:1px solid #e7eeea;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(20,40,30,.05)}
.stat-icon{width:38px;height:38px;border-radius:10px;background:#e6f4ec;color:#1e7a4f;display:grid;place-items:center;font-size:18px;margin-bottom:10px}
.stat-card b{font-size:21px;display:block}
.stat-card span{font-size:12px;color:#6b7280}

/* chart */
.chart{display:flex;align-items:flex-end;gap:12px;height:190px;padding:14px 8px 0}
.chart .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:70%;max-width:46px;background:linear-gradient(180deg,#34a96f,#1e7a4f);border-radius:6px 6px 0 0;position:relative}
.chart .bar span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#1e7a4f}
.chart .x{font-size:11px;color:#6b7280}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,30,22,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:min(640px,96vw);max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-close{width:32px;height:32px;border-radius:8px;background:#f2f6f3;font-size:16px}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:#0f3d27;color:#fff;padding:11px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:300;font-weight:600;font-size:13.5px;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* misc */
.empty{padding:50px 20px;text-align:center;color:#6b7280}
.empty .e{font-size:46px;margin-bottom:10px}
.chip{display:inline-block;background:#eef3f0;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.active{background:#1e7a4f;color:#fff}
.footer{margin-top:auto;background:#fff;border-top:1px solid #e4eae6;padding:26px 0;font-size:12.5px;color:#6b7280}
.filter-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid #e7eeea;border-radius:14px;padding:14px 16px;margin-bottom:16px}
.filter-bar .field{margin-bottom:0;min-width:150px;flex:1}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.divider{height:1px;background:#eef3f0;margin:12px 0}
.btn-light{background:#fff;color:#1e7a4f}
.btn-outline-light{border-color:rgba(255,255,255,.7);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9d8cf;border-radius:5px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast">OK</div>
<div class="modal-overlay" id="modalRoot"></div>
<script>

/* ================= HELPERS ================= */

function fmtDT(s){ if(!s) return '—'; const d = new Date(s); if(isNaN(d.getTime())) return s; const p=(x)=>String(x).padStart(2,'0'); return `${d.getDate()}/${d.getMonth()+1}/${String(d.getFullYear()).slice(2)} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtD(s){ if(!s) return '—'; const d = new Date(s); if(isNaN(d.getTime())) return s; return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`; }
function todayStr(){ const d=new Date(); const p=(x)=>String(x).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

  {id:2,name:'Xoài cát Hải Long (1kg)',image:'🥭',price:65000,originalPrice:80000,discountPercent:19,stock:25,categoryId:2,categoryName:'Trái cây',description:'Xoài cát Hải Long chín cây, thơm dày, ngọt thanh, không dập.',shelfLifeDays:7,nearestExpiry:'2026-11-11',daysLeft:7,favouriteCount:41,active:true,createdDate:'2026-10-06T08:10',updatedDate:'2026-10-06T08:10',images:[{id:2,imageUrl:'/UploadFiles/Product/Image/mango.png',productId:2}]},

/* ================= ROUTER ================= */
function getSeg(){ const raw=(location.hash||'').replace(/^#/,'')||'/'; const path=raw.split('?')[0]; return path.split('/').filter(Boolean); }
function getParams(){ const raw=(location.hash||'').replace(/^#/,''); const qi=raw.indexOf('?'); const qs=qi>=0?raw.slice(qi+1):''; return Object.fromEntries(new URLSearchParams(qs)); }
function navigate(to){ location.hash = '#'+(to||'/'); }
function route(){
  const seg = getSeg();
  const param = getParams();
  let html='';
  let view='';
  const adminRoot = seg[0]==='admin';
  let adminPage = adminRoot ? (seg[1]||'dashboard') : null;
  if(seg.length===0){ view='home'; html = storeLayout(renderHome()); }
  else if(seg[0]==='products'){ view='products'; html = storeLayout(renderProducts(param)); }
  else if(seg[0]==='product'){ view='product'; html = storeLayout(renderProductDetail(Number(seg[1]))); }
  else if(seg[0]==='cart'){ view='cart'; html = storeLayout(renderCart()); }
  else if(seg[0]==='checkout'){ view='checkout'; html = storeLayout(renderCheckout()); }
  else if(seg[0]==='orders'){ view='orders'; html = storeLayout(seg[1]? renderOrderDetail(Number(seg[1])) : renderOrders()); }
  else if(seg[0]==='favourites'){ view='favourites'; html = storeLayout(renderFavourites()); }
  else if(seg[0]==='account'){ view='account'; html = storeLayout(renderAccount()); }
  else if(seg[0]==='login'){ view='auth'; html = storeLayout(renderAuth('login')); }
  else if(seg[0]==='register'){ view='auth'; html = storeLayout(renderAuth('register')); }
  else if(adminRoot){ view='admin-'+adminPage; html = renderAdminLayout(adminPage, renderAdminView(adminPage)); }
  else { view='notfound'; html = storeLayout(renderNotFound()); }
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
}

window.addEventListener('load', ()=>render());

/* ================= SHARED UI ================= */
function isFav(pid){
  const u = state.user;
  if(!u) return false;
  return state.favourites.some(f=>f.userId===u.id && f.productId===pid);
}
function productCard(p){
  const soldOut = p.stock<=0;
  const fav = isFav(p.id);
  return `
  <div class="product-card">
    <a href="#/product/${p.id}"><div class="pimg">${p.image}</div></a>
    <button class="fav-btn ${fav?'active':''}" data-action="fav-toggle" data-id="${p.id}">${fav?'❤️':'🤍'}</button>
    <div class="pbody">
      <div class="pname">${p.name}</div>

        <div><span class="price">${fmtMoney(p.price)}</span><span class="price-old">${fmtMoney(p.originalPrice)}</span><span class="discount-badge">-${p.discountPercent}%</span></div>

      <div class="pactions">

      </div>
    </div>
  </div>`;
}
function discountBadge(p){ return `<span class="discount-badge">-${p.discountPercent}%</span>`; }
function statusBadge(s){
  const map = {PENDING:'st-PENDING',CONFIRMED:'st-CONFIRMED',SHIPPING:'st-SHIPPING',COMPLETED:'st-COMPLETED',CANCELLED:'st-CANCELLED',PAID:'st-PAID',UNPAID:'st-UNPAID',ACTIVE:'st-ACTIVE',SOLD_OUT:'st-SOLD_OUT',EXPIRED:'st-EXPIRED'};
  return `<span class="st ${map[s]||'st-PENDING'}">${s}</span>`;
}
function emptyState(icon,title,sub,actionText,actionTo){
  return `<div class="empty"><div class="e">${icon}</div><h3>${title}</h3><p class="muted">${sub}</p>${actionText?`<div class="mt16"><button class="btn btn-primary" data-action="go-nav" data-to="${actionTo}">${actionText}</button></div>`:''}</div>`;
}

function renderCart(){
  const items = state.cart.map(ci=>({...ci, product: state.products.find(p=>p.id===ci.productId)})).filter(x=>x.product);
  const subtotal = items.reduce((s,i)=>s+(i.price*i.quantity||0),0);
  const usableCoupons = state.coupons.filter(c=>c.active && todayStr()>=c.startDate.slice(0,10) && todayStr()<=c.endDate.slice(0,10) && subtotal>=c.minOrderValue);
  const coupon = usableCoupons.find(c=>c.code===state.cartCoupon) || null;
  const discount = coupon? (coupon.discountType==='PERCENT'? Math.min(subtotal*coupon.discountValue/100, coupon.maxDiscount||subtotal) : coupon.discountValue) : 0;
  const discountAmt = Math.round(discount);
  const shipping = (subtotal-discountAmt)>=200000 ? 0 : 30000;
  const total = subtotal-discountAmt+shipping;

function render(){
  const seg = getSeg();
  const param = getParams();
  const adminRoot = seg[0]==='admin';
  let html='';
  if(seg.length===0){ html = storeLayout(renderHome()); }
  else if(seg[0]==='products'){ html = storeLayout(renderProducts(param)); }
  else if(seg[0]==='product'){ html = storeLayout(renderProductDetail(Number(seg[1]))); }
  else if(seg[0]==='cart'){ html = storeLayout(renderCart()); }
  else if(seg[0]==='checkout'){ html = storeLayout(renderCheckout()); }
  else if(seg[0]==='orders'){ html = storeLayout(seg[1]? renderOrderDetail(Number(seg[1])) : renderOrders()); }
  else if(seg[0]==='favourites'){ html = storeLayout(renderFavourites()); }
  else if(seg[0]==='account'){ html = storeLayout(renderAccount()); }
  else if(seg[0]==='login'){ html = storeLayout(renderAuth('login')); }
  else if(seg[0]==='register'){ html = storeLayout(renderAuth('register')); }
  else if(adminRoot){ html = renderAdminLayout(seg[1]||'dashboard', renderAdminView(seg[1]||'dashboard')); }
  else { html = storeLayout(renderNotFound()); }
  document.getElementById('app').innerHTML = html;
}

/* ================= ACTIONS ================= */
function goNav(to){ navigate(to); }
function goHome(){ navigate('/'); }
function goProducts(to){ navigate(to||'/products'); }
function goProduct(id){ navigate('/product/'+id); }
function goCart(){ navigate('/cart'); }
function goOrders(){ navigate('/orders'); }
function goFavourites(){ navigate('/favourites'); }
function goAccount(){ navigate('/account'); }
function goLogin(){ navigate('/login'); }
function goCheckout(){ navigate('/checkout'); }
function goOrder(id){ navigate('/orders/'+id); }

function addToCart(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  const ex = state.cart.find(i=>i.productId===id);
  if(ex){ ex.quantity = Math.min(p.stock||ex.quantity+1, ex.quantity+1); ex.subtotal = Math.round(ex.price*ex.quantity); }
  else { state.cart.push({productId:id,quantity:1,price:p.price,originalPrice:p.originalPrice,discountPercent:p.discountPercent,subtotal:p.price,available:p.stock>0}); }
  saveCart(); updateCartBadge(); showToast('✅ Đã thêm vào giỏ hàng'); render();
}
function buyNow(id){ addToCart(id); navigate('/checkout'); }
function setQty(id, delta){
  const i = state.cart.find(i=>i.productId===id);
  if(!i) return;
  i.quantity = Math.max(1, Math.min((i.available?state.products.find(p=>p.id===id)?.stock:99) || 1, i.quantity+delta));
  i.subtotal = Math.round(i.price*i.quantity); saveCart(); render();
}
function cartRemove(id){
  state.cart = state.cart.filter(i=>i.productId!==id); saveCart(); updateCartBadge(); render();
}
function toggleFav(id){
  const u = state.user;
  if(!u) return showToast('Vui lòng đăng nhập để dùng tính năng yêu thích');
  const ex = state.favourites.find(f=>f.userId===u.id && f.productId===id);
  if(ex) state.favourites = state.favourites.filter(f=>f.id!==ex.id);
  else state.favourites.push({id:Date.now(),userId:u.id,productId:id,productName:'',productImage:'',productPrice:0,createdDate:nowStr()});
  saveLS(); render();
}
function placeOrder(){
  const form = $('#f-checkout form, #f-checkout');
  const fd = new FormData(form);
  const name = fd.get('name'); const phone = fd.get('phone'); const address = fd.get('address'); const note = fd.get('note'); const method = fd.get('method')||'COD';
  if(!name || !phone || !address){ showToast('Vui lòng nhập đầy đủ thông tin giao hàng'); return; }
  const items = state.cart.map(ci=>({...ci, product: state.products.find(p=>p.id===ci.productId)})).filter(x=>x.product);
  const subtotal = items.reduce((s,i)=>s+(i.price*i.quantity||0),0);
  const coupon = state.coupons.find(c=>c.code===state.cartCoupon) || null;
  const discountAmt = coupon? (coupon.discountType==='PERCENT'? Math.min(subtotal*coupon.discountValue/100, coupon.maxDiscount||subtotal) : coupon.discountValue) : 0;
  const discount = Math.round(discountAmt);
  const shipping = (subtotal-discount)>=200000?0:30000;
  const total = Math.round(subtotal-discount+shipping);
  const order = {id:Date.now(),orderCode:'ORD-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+String(Math.floor(Math.random()*9000)+1000),customerName:name,email:state.user?state.user.email:'',phone,address,note,orderDate:nowStr(),total,status:'PENDING',statusId:1,couponCode:coupon?coupon.code:null,userId:state.user?state.user.id:null,paymentMethod:method,paymentStatus:'UNPAID',items};
  state.orders.unshift(order);
  state.cart=[]; saveCart();
  navigate('/orders/'+order.id);
  showToast('🎉 Đặt hàng thành công!');
}
function orderPay(id){ const o = state.orders.find(o=>o.id===id); if(!o) return; o.paymentStatus='PAID'; saveLS(); render(); showToast('💰 Thanh toán thành công'); }
function orderCancel(id){ const o = state.orders.find(o=>o.id===id); if(!o) return; o.status='CANCELLED'; o.statusId=5; render(); showToast('Đơn hàng đã hủy'); }

function login(email, password){
  const u = state.users ? state.users : USERS;
  const found = u.find(x=>(x.email===email||x.username===email) && x.password===password);
  if(!found){ showToast('❌ Sai email/username hoặc mật khẩu'); return false; }
  if(found.status===0){ showToast('❌ Tài khoản đã bị khóa'); return false; }
  state.user = {id:found.id,username:found.username,email:found.email,firstName:found.firstName,lastName:found.lastName,mobile:found.mobile,address:found.address,avatar:found.avatar,status:found.status,roles:found.roles||['ROLE_USER'],balance:found.balance||0};
  saveLS(); updateUserBadge(); render(); showToast('✅ Đăng nhập thành công'); navigate('/'); return true;
}
function register(data){
  const u = {id:Date.now(),username:data.username||'user'+Date.now(),email:data.email,password:data.password,firstName:data.firstName,lastName:data.lastName,mobile:data.mobile,address:data.address,status:1,roles:['ROLE_USER'],balance:500000};
  state.users = state.users||[]; state.users.push(u);
  state.user = {id:u.id,username:u.username,email:u.email,firstName:u.firstName,lastName:u.lastName,mobile:u.mobile,address:u.address,avatar:'👨‍🌾',status:1,roles:['ROLE_USER'],balance:500000};
  saveLS(); saveLS(); updateUserBadge(); render(); showToast('✅ Đăng ký thành công!'); navigate('/'); return true;
}
function logout(){ state.user=null; saveLS(); updateUserBadge(); render(); showToast('Đã đăng xuất'); }

function updateCartBadge(){ const c = state.cart.reduce((s,i)=>s+(i.quantity||0),0); const el=$('.icon-btn .cnt'); if(el){ el.textContent=c; } const b=$('.header-actions .icon-btn'); /* noop */ }
function updateUserBadge(){ const el=$('.header-actions .icon-btn:nth-child(3)'); /* noop placeholder */ }

/* ================= EVENT DELEGATION ================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id ? Number(el.dataset.id) : null;
  const to = el.dataset.to || null;
  switch(action){
    case 'go-home': navigate('/'); break;
    case 'go-nav': navigate(to); break;
    case 'go-products': navigate(to||'/products'); break;
    case 'go-product': navigate('/product/'+id); break;
    case 'go-cart': navigate('/cart'); break;
    case 'go-orders': navigate('/orders'); break;
    case 'go-favourites': navigate('/favourites'); break;
    case 'go-account': navigate('/account'); break;
    case 'go-login': navigate('/login'); break;
    case 'go-checkout': navigate('/checkout'); break;
    case 'go-admin': navigate('/admin'); break;
    case 'go-auth-switch': navigate(state._authMode==='login'?'/register':'/login'); break;
    case 'add-cart': addToCart(id); break;
    case 'buy-now': buyNow(id); break;
    case 'fav-toggle': toggleFav(id); break;
    case 'qty-inc': setQty(id,1); break;
    case 'qty-dec': setQty(id,-1); break;
    case 'cart-remove': cartRemove(id); break;
    case 'place-order': placeOrder(); break;
    case 'order-pay': orderPay(id); break;
    case 'order-cancel': orderCancel(id); break;
    case 'logout': logout(); break;
    case 'login-submit': { const f=$('#f-auth'); const fd=new FormData(f); login(fd.get('email'), fd.get('password')); break; }
    case 'register-submit': { const f=$('#f-auth'); const fd=new FormData(f); register({username:fd.get('username')||('user'+Date.now()),firstName:fd.get('firstName'),lastName:fd.get('lastName'),email:fd.get('email'),mobile:fd.get('mobile'),password:fd.get('password'),address:fd.get('address')}); break; }
    case 'admin-nav': navigate('/admin'+(to||'')); break;
    case 'admin-back': navigate('/'); break;
    case 'admin-product-new': openModal(renderProductForm(null)); break;
    case 'admin-product-edit': openModal(renderProductForm(id)); break;
    case 'admin-product-delete': { state.products = state.products.filter(p=>p.id!==id); render(); showToast('Sản phẩm đã xóa'); break; }
    case 'admin-cat-new': openModal(renderCategoryForm(null)); break;
    case 'admin-cat-edit': openModal(renderCategoryForm(id)); break;
    case 'admin-cat-delete': { state.categories = state.categories.filter(c=>c.id!==id); render(); showToast('Danh mục đã xóa'); break; }
    case 'admin-coupon-new': openModal(renderCouponForm(null)); break;
    case 'admin-coupon-edit': openModal(renderCouponForm(id)); break;
    case 'admin-coupon-delete': { state.coupons = state.coupons.filter(c=>c.id!==id); render(); showToast('Mã giảm giá đã xóa'); break; }
    case 'admin-user-edit': openModal(renderUserForm(id)); break;
    case 'admin-user-toggle': { const u=state.users.find(u=>u.id===id); if(u){ u.status=u.status?0:1; saveLS(); render(); showToast(u.status?'Tài khoản đã bị khóa':'Tài khoản đã được mở khóa'); } break; }
    case 'admin-order-view': openModal(renderOrderModal(id)); break;
    case 'batch-writeoff': { state.batches.forEach(b=>{ if(b.daysLeft<=0) b.status='EXPIRED'; }); render(); showToast('Đã viết off các lô hết hạn'); break; }
    case 'modal-close': closeModal(); break;
    case 'batch-view': { const b=state.batches.find(b=>b.id===id); showToast(`Lô hàng #${b?b.id:'?'} – ${b?b.productName:'?'} – còn ${b?b.daysLeft:'?'} ngày`); break; }
    case 'cat-filter': { state._catFilter = el.closest('.filter-bar')?el.closest('.filter-bar').querySelector('[data-field="cat"]').value:''; navigate('/products?cat='+state._catFilter); break; }
    case 'sort-filter': { state._sortFilter = el.closest('.filter-bar')?el.closest('.filter-bar').querySelector('[data-field="sort"]').value:''; navigate('/products?sort='+state._sortFilter); break; }
    default: break;
  }
});
document.addEventListener('submit', e=>{
  const form = e.target;
  if(!form || !form.id) return;
  e.preventDefault();
  if(form.id==='f-search'){ navigate('/products?q='+encodeURIComponent(new FormData(form).get('q'))); return; }
  if(form.id==='f-auth'){
    const fd = new FormData(form);
    const isLogin = !form.querySelector('input[name="firstName"]');
    if(isLogin){ login(fd.get('email'), fd.get('password')); }
    else { register({username:fd.get('username')||('user'+Date.now()),firstName:fd.get('firstName'),lastName:fd.get('lastName'),email:fd.get('email'),mobile:fd.get('mobile'),password:fd.get('password'),address:fd.get('address')}); }
    return;
  }
  if(form.id==='f-checkout'){ placeOrder(); return; }
  if(form.id==='f-product'){ const fd=new FormData(form); saveProduct(fd); closeModal(); return; }
  if(form.id==='f-category'){ const fd=new FormData(form); saveCategory(fd); closeModal(); return; }
  if(form.id==='f-coupon'){ const fd=new FormData(form); saveCoupon(fd); closeModal(); return; }
  if(form.id==='f-user'){ const fd=new FormData(form); saveUser(fd); closeModal(); return; }
});
document.addEventListener('change', e=>{
  const el = e.target;
  const key = el.getAttribute('data-field');
  if(key==='cartCoupon'){ state.cartCoupon = el.value; render(); return; }
  if(key==='cat'){ navigate('/products?cat='+el.value); return; }
  if(key==='sort'){ navigate('/products?sort='+el.value); return; }
  const m = /^orderStatus_(\d+)$/.exec(key||''); if(m){ const o = state.orders.find(o=>o.id===Number(m[1])); if(o){ o.status = el.value; } render(); return; }
  const m2 = /^paymentStatus_(\d+)$/.exec(key||''); if(m2){ const o = state.orders.find(o=>o.id===Number(m2[1])); if(o){ o.paymentStatus = el.value; } render(); return; }
});
document.addEventListener('input', e=>{
  const el = e.target;
  const key = el.getAttribute('data-field');
  if(key && key.startsWith('minPrice')){} // handled by submit-less filter -> not used
});

/* ================= PRODUCT / CATEGORY / COUPON / USER FORMS ================= */
function renderProductForm(p){
  const isNew = !p;
  const prod = p;
  return `
  <div class="modal-head"><b>${isNew?'Thêm sản phẩm':'Sửa sản phẩm'}</b><button class="modal-close" data-action="modal-close">✕</button></div>
  <form id="f-product">
    <div class="field"><label class="label">Tên</label><input class="input" name="name" value="${prod?prod.name:''}" required></div>
    <div class="grid2">
      <div class="field"><label class="label">Danh mục</label><select class="select" name="categoryId">${state.categories.map(c=>`<option value="${c.id}" ${prod&&prod.categoryId===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="field"><label class="label">Tồn kho</label><input class="input" type="number" name="stock" value="${prod?prod.stock:0}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="label">Giá</label><input class="input" type="number" step="0.01" name="price" value="${prod?prod.price:0}"></div>
      <div class="field"><label class="label">Giảm %</label><input class="input" type="number" name="discountPercent" value="${prod?prod.discountPercent:0}"></div>
    </div>
    <div class="field"><label class="label">Mô tả</label><textarea class="textarea" name="description" required>${prod?prod.description:''}</textarea></div>
    <button class="btn btn-primary btn-block" type="submit">${isNew?'Tạo':'Lưu thay đổi'}</button>
  </form>`;
}
function saveProduct(fd){
  const data = {name:fd.get('name'),categoryId:Number(fd.get('categoryId')),stock:Number(fd.get('stock')),price:Number(fd.get('price')),discountPercent:Number(fd.get('discountPercent')||0),description:fd.get('description')};
  if(!data.name){ showToast('Vui lòng nhập tên sản phẩm'); return; }
  if(data.id){ const p = state.products.find(p=>p.id===data.id); Object.assign(p,data); showToast('Sản phẩm đã cập nhật'); }
  else { state.products.push({id:Date.now(),...data,image:'🥬',originalPrice:Math.round(data.price*(1+data.discountPercent/100)),nearestExpiry:'2026-12-01',daysLeft:30,favouriteCount:0,active:true,createdDate:nowStr(),updatedDate:nowStr()}); showToast('Sản phẩm đã tạo'); }
  render();
}
function renderCategoryForm(c){
  const isNew=!c;
  return `
  <div class="modal-head"><b>${isNew?'Thêm danh mục':'Sửa danh mục'}</b><button class="modal-close" data-action="modal-close">✕</button></div>
  <form id="f-category">
    <div class="field"><label class="label">Tên</label><input class="input" name="name" value="${c?c.name:''}" required></div>
    <button class="btn btn-primary btn-block" type="submit">${isNew?'Tạo':'Lưu'}</button>
  </form>`;
}
function saveCategory(fd){ const name=fd.get('name'); if(!name){showToast('Vui lòng nhập tên danh mục');return;} if(fd.get('id')){ const c=state.categories.find(c=>c.id===Number(fd.get('id'))); c.name=name; showToast('Danh mục đã cập nhật'); } else { state.categories.push({id:Date.now(),name,image:'🧺',active:1,parentCategoryId:null,parentCategoryName:null,children:[]}); showToast('Danh mục đã tạo'); } render(); }
function renderCouponForm(c){
  const isNew=!c;
  const co = c;
  return `
  <div class="modal-head"><b>${isNew?'Thêm mã giảm giá':'Sửa mã giảm giá'}</b><button class="modal-close" data-action="modal-close">✕</button></div>
  <form id="f-coupon">
    <div class="grid2">
      <div class="field"><label class="label">Mã</label><input class="input" name="code" value="${co?co.code:''}" required></div>
      <div class="field"><label class="label">Tên</label><input class="input" name="name" value="${co?co.name:''}" required></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="label">Loại giảm</label><select class="select" name="discountType"><option value="PERCENT" ${co&&co.discountType==='PERCENT'?'selected':''}>PERCENT (%)</option><option value="FIXED" ${co&&co.discountType==='FIXED'?'selected':''}>FIXED (-)</option></select></div>
      <div class="field"><label class="label">Giá trị</label><input class="input" type="number" name="discountValue" value="${co?co.discountValue:0}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="label">Min đơn</label><input class="input" type="number" name="minOrderValue" value="${co?co.minOrderValue:0}"></div>
      <div class="field"><label class="label">Max giảm</label><input class="input" type="number" name="maxDiscount" value="${co&&co.maxDiscount?co.maxDiscount:''}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="label">Ngày bắt đầu</label><input class="input" type="date" name="startDate" value="${co?co.startDate:''}"></div>
      <div class="field"><label class="label">Ngày kết thúc</label><input class="input" type="date" name="endDate" value="${co?co.endDate:''}"></div>
    </div>
    <button class="btn btn-primary btn-block" type="submit">${isNew?'Tạo':'Lưu'}</button>
  </form>`;
}
function saveCoupon(fd){
  const data = {code:fd.get('code'),name:fd.get('name'),discountType:fd.get('discountType'),discountValue:Number(fd.get('discountValue')||0),minOrderValue:Number(fd.get('minOrderValue')||0),maxDiscount:fd.get('maxDiscount')?Number(fd.get('maxDiscount')):null,startDate:fd.get('startDate'),endDate:fd.get('endDate'),active:1,usedCount:0};
  if(fd.get('id')){ const c=state.coupons.find(c=>c.id===Number(fd.get('id'))); Object.assign(c,data); showToast('Mã giảm giá đã cập nhật'); }
  else { state.coupons.push({id:Date.now(),...data}); showToast('Mã giảm giá đã tạo'); }
  render();
}
function renderUserForm(u){
  const isNew=!u;
  return `
  <div class="modal-head"><b>${isNew?'Thêm khách hàng':'Sửa khách hàng'}</b><button class="modal-close" data-action="modal-close">✕</button></div>
  <form id="f-user">
    <div class="grid2">
      <div class="field"><label class="label">Username</label><input class="input" name="username" value="${u?u.username:''}" required></div>
      <div class="field"><label class="label">Email</label><input class="input" name="email" value="${u?u.email:''}" required></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="label">Họ</label><input class="input" name="firstName" value="${u?u.firstName:''}"></div>
      <div class="field"><label class="label">Tên</label><input class="input" name="lastName" value="${u?u.lastName:''}"></div>
    </div>
    <div class="field"><label class="label">Số điện thoại</label><input class="input" name="mobile" value="${u?u.mobile:''}"></div>
    <div class="field"><label class="label">Ví (VND)</label><input class="input" type="number" name="balance" value="${u?u.balance||0:0}"></div>
    <button class="btn btn-primary btn-block" type="submit">${isNew?'Tạo':'Lưu'}</button>
  </form>`;
}
function saveUser(fd){
  const data = {username:fd.get('username'),email:fd.get('email'),firstName:fd.get('firstName'),lastName:fd.get('lastName'),mobile:fd.get('mobile'),balance:Number(fd.get('balance')||0)};
  if(fd.get('id')){ const u=state.users.find(u=>u.id===Number(fd.get('id'))); Object.assign(u,data); showToast('Khách hàng đã cập nhật'); }
  else { state.users.push({id:Date.now(),...data,status:1,roles:['ROLE_USER'],createdDate:nowStr(),updatedDate:nowStr()}); showToast('Khách hàng đã tạo'); }
  render();
}
function renderOrderModal(id){
  const o = state.orders.find(o=>o.id===id);
  if(!o) return '';
  return `
  <div class="modal-head"><b>${o.orderCode}</b><button class="modal-close" data-action="modal-close">✕</button></div>
  <div class="row mb8">${statusBadge(o.status)} ${statusBadge(o.paymentStatus)} <span class="muted small">${fmtDT(o.orderDate)}</span></div>
  <p style="margin:0 0 8px">${o.customerName} · ${o.email} · ${o.phone}<br/>${o.address}</p>
  ${o.items.map(i=>`<div class="order-item"><span style="font-size:22px">${i.productImage}</span><span class="grow">${i.productName} <span class="muted">x${i.quantity}</span></span><b>${fmtMoney(i.subtotal)}</b></div>`).join('')}
  <div class="divider"></div>
  <div class="row between"><span class="muted">Tổng</span><b>${fmtMoney(o.total)}</b></div>
  <button class="btn btn-primary btn-block mt12" data-action="modal-close">Đóng</button>
`;
}

/* ================= INIT ================= */
function init(){
  // countdown
  const end = new Date(); end.setHours(23,59,59,999);
  const tick = ()=>{
    const el = document.getElementById('countdown');
    if(el){ const diff = Math.max(0, end.getTime()-Date.now()); const h=Math.floor(diff/3600000), m=Math.floor(diff%3600000/60000), s=Math.floor(diff%60000/1000); el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
  };
  tick(); setInterval(tick, 1000);
  render();
}
document.getElementById('modalRoot').addEventListener('click', e=>{ if(e.target.id==='modalRoot') closeModal(); });
init();
</script>
