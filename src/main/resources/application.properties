spring.application.name=web-ind-mart-api

# Nạp biến môi trường từ file .env (không commit file này lên git, xem .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=9090
server.jetty.threads.max=200
server.jetty.threads.min=8
server.jetty.connection-idle-timeout=30s

app.rate-limit.enabled=true
# ─── Database ──────────────────────────────────────────────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/javaweb34db_btck?useSSL=false&serverTimezone=UTC}
spring.datasource.url=jdbc:mysql://localhost:3306/javaweb34db_btck?sslMode=REQUIRED&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ─── File Upload ───────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB

# ─── Hibernate / JPA ───────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ─── Application ───────────────────────────────────────────────

app.upload-dir=UploadFiles

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/indmart}


# ─── Swagger ───────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ─── Mail ──────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Gom các truy vấn lazy (ảnh, danh mục) của cả trang thành 1-2 câu SQL thay vì N câu
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Tăng số kết nối tới MySQL (mặc định là 10)
spring.datasource.hikari.maximum-pool-size=30